[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-alarm"
version = "0.1.4"
description = "Persistent Codex alarms and external wake events"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Crihexe", email = "cristiann.di.nicola@gmail.com"}]

[project.scripts]
codex-alarm = "codex_alarm.cli:main"

[tool.setuptools.packages.find]
include = ["codex_alarm*"]
